<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Tabla 1</h1>
    <table border="1">
        <!--Se usa para ponerle como un titulo a la tabla-->
        <caption>Lista de Mascotas</caption>
        <thead>
            <tr>
                <!--th se ocupa para encabezar en tablas-->
                <th>Mascota</th>
                <th>Edad</th>
                <th>Color</th>
            </tr>
        </thead>
        <!--Se ocupan thead y tbody solo para darle estructura y este dividido por que en si no aparece nada en la tabla es mas para nosotros-->
        <tbody>
            <tr>
                <!--td se ocupa para llenar las filas de cada columna encabezada -->
                <td>Perro</td>
                <td>3 años</td>
                <td>Cafe</td>
            </tr>
            <!--tr es para darle un salto de linea a cada fila -->
            <tr>
                <td>Gato </td>
                <td>1 año </td>
                <td>Blanco </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
